<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Down the Stack</title>
<meta name="description" content="Computer science from the tools you use down to the physics, maths and philosophy underneath: 530 concepts, each with a read and sources.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Down the Stack</h1>
      <p>Computer science from the tools you use to the physics, maths and philosophy underneath. <span class="modepill" id="mode"></span></p>
    </div>
    <div class="search">
      <label for="q" style="position:absolute;left:-9999px">Search concepts and reads</label>
      <input id="q" type="search" placeholder="Search every concept and read  ( / )" autocomplete="off">
      <div class="sres" id="sres" hidden></div>
    </div>
    <div class="tabs" role="group" aria-label="View">
      <button type="button" data-view="explore" aria-pressed="true">Explore</button>
      <button type="button" data-view="tours" aria-pressed="false">Tours</button>
      <button type="button" data-view="courses" aria-pressed="false">Courses</button>
      <button type="button" data-view="design" aria-pressed="false">Design</button>
      <button type="button" data-view="algorithms" aria-pressed="false">Algorithms</button>
      <button type="button" data-view="atlas" aria-pressed="false">Atlas</button>
      <button type="button" data-view="library" aria-pressed="false">Library</button>
      <button type="button" data-view="you" aria-pressed="false">You</button>
    </div>
  </header>
  <nav class="strip" id="strip" aria-label="Layers"></nav>
  <div class="desk">
    <section class="main" id="main">
      <div id="v-explore"><div class="trail" id="trail"></div></div>
      <div class="cols" id="cols"></div>
      <div class="tours" id="v-tours" hidden></div>
      <div class="tours" id="v-courses" hidden></div>
      <div class="view" id="v-design" hidden></div>
      <div class="view" id="v-algorithms" hidden></div>
      <div class="atlas" id="v-atlas" hidden></div>
      <div class="view" id="v-library" hidden></div>
      <div class="view" id="v-you" hidden></div>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</div>
<div class="reader" id="reader" role="dialog" aria-modal="true" aria-label="Reader" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
<script src="algo.js"></script>
</body>
</html>
